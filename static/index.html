<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Good Morning Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #232946;
    --surface: #2E3454;
    --surface-alt: #3B4368;
    --accent-warm: #F1A661;
    --accent-cool: #8AB6D6;
    --accent-rust: #C1666B;
    --accent-sage: #8FBF9F;
    --text-primary: #F5EFE6;
    --text-muted: #9A93B3;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Space Grotesk', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
  }

  .dashboard {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    grid-template-rows: 1fr auto;
    grid-template-areas:
      "left right"
      "footer footer";
    gap: 16px;
    height: 100vh;
    padding: 16px;
  }

  .left-col {
    grid-area: left;
    display: grid;
    grid-template-rows: 30% 70%;
    gap: 16px;
    min-height: 0;
  }

  .right-col {
    grid-area: right;
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 16px;
    min-height: 0;
  }

  .card {
    background: var(--surface);
    border-radius: 20px;
    padding: 28px;
    transition: box-shadow 0.4s ease;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .card.leave-now {
    box-shadow: 0 0 0 3px var(--accent-warm);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px var(--accent-warm); }
    50% { box-shadow: 0 0 0 7px rgba(241, 166, 97, 0.35); }
  }

  .eyebrow {
    font-family: var(--font-body);
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent-cool);
    margin-bottom: 14px;
  }

  .clock-card {
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .greeting {
    font-family: var(--font-display);
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
    min-height: 1.4em;
  }
  .clock {
    font-family: var(--font-body);
    font-size: clamp(2.0rem, 9vw, 9.0rem);
    font-weight: 500;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
  }
  .clock .ampm {
    font-size: 0.4em;
    font-weight: 600;
    color: var(--accent-warm);
    margin-left: 6px;
  }
  .date-line {
    font-family: var(--font-body);
    font-size: 1rem;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .calendar-card {
    flex: 1;
  }
  .calendar-card h2 {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .calendar-placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-muted);
    gap: 10px;
  }
  .calendar-placeholder .placeholder-icon {
    font-size: 2.4rem;
    opacity: 0.6;
  }
  .calendar-placeholder .placeholder-text {
    font-family: var(--font-display);
    font-size: 1.1rem;
    color: var(--text-muted);
  }
  .calendar-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .calendar-event {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--surface-alt);
  }
  .calendar-event:last-child { border-bottom: none; }
  .calendar-event-time {
    font-family: var(--font-body);
    font-weight: 600;
    color: var(--accent-cool);
    font-size: 0.9rem;
    min-width: 70px;
    flex-shrink: 0;
  }
  .calendar-event.all-day .calendar-event-time {
    color: var(--accent-warm);
  }
  .calendar-event-title {
    font-size: 1rem;
    color: var(--text-primary);
  }
  .calendar-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-family: var(--font-display);
    font-size: 1.05rem;
    text-align: center;
  }

  .commute-card h2, .weather-card h2 {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .big-time {
    font-family: var(--font-body);
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 700;
    margin-top: 6px;
  }
  .sub-time {
    font-size: 1rem;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .leave-by-line {
    font-size: 1.2rem;
    margin-top: 12px;
    font-weight: 600;
  }
  .leave-by-line.urgent {
    color: var(--accent-warm);
  }
  .tag-row {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .delay-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .delay-ontime { background: rgba(143, 191, 159, 0.18); color: var(--accent-sage); }
  .delay-minor { background: rgba(241, 166, 97, 0.18); color: var(--accent-warm); }
  .delay-late { background: rgba(193, 102, 107, 0.22); color: var(--accent-rust); }

  .transfer-info {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--surface-alt);
  }
  .transfer-info div {
    margin-bottom: 5px;
    color: var(--text-muted);
    font-size: 0.95rem;
  }
  .inactive-window {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-muted);
    font-family: var(--font-display);
    font-size: 1.2rem;
  }

  .weather-temp {
    font-family: var(--font-body);
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 700;
    margin-top: 6px;
  }
  .weather-condition {
    font-size: 1.1rem;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .attire {
    margin-top: 14px;
    font-size: 1.2rem;
  }
  .commute-warning {
    margin-top: 14px;
    padding: 10px 14px;
    background: rgba(193, 102, 107, 0.22);
    color: var(--accent-rust);
    border-radius: 10px;
    font-size: 0.95rem;
  }

  .footer-strip {
    grid-area: footer;
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 0 4px;
  }
  .alert-item {
    background: rgba(193, 102, 107, 0.22);
    color: var(--accent-rust);
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
  }
  .error-pill {
    background: rgba(193, 102, 107, 0.22);
    color: var(--accent-rust);
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="dashboard">
  <div class="left-col">
    <div class="card clock-card" id="clockCard">
      <div class="greeting" id="greeting"></div>
      <div class="clock" id="clock"></div>
      <div class="date-line" id="dateLine"></div>
    </div>

    <div class="card calendar-card" id="calendarCard">
      <div class="eyebrow">Today</div>
      <h2>Calendar</h2>
      <div class="calendar-placeholder" id="calendarContent">
        <div class="placeholder-icon">📅</div>
        <div class="placeholder-text">Calendar coming soon</div>
      </div>
    </div>
  </div>

  <div class="right-col">
    <div class="card commute-card" id="commuteCard">
      <div class="eyebrow">Commute</div>
      <h2>On the way</h2>
      <div id="commuteContent" style="display:flex; flex-direction:column; flex:1;">Loading...</div>
    </div>

    <div class="card weather-card" id="weatherCard">
      <div class="eyebrow">Outside</div>
      <h2>Weather</h2>
      <div id="weatherContent">Loading...</div>
    </div>
  </div>

  <div class="footer-strip" id="footerStrip"></div>
</div>

<script>
const DEFAULT_POLL_INTERVAL_MS = 60000;

function updateClock() {
  const now = new Date();
  let h = now.getHours() % 12;
  if (h === 0) h = 12;
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
  document.getElementById('clock').innerHTML = `${h}:${m}:${s}<span class="ampm">${ampm}</span>`;
  document.getElementById('dateLine').textContent =
    now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}
updateClock();
setInterval(updateClock, 1000);

function scheduleNextFetch() {
  fetchDashboard().then((intervalMs) => {
    setTimeout(scheduleNextFetch, intervalMs || DEFAULT_POLL_INTERVAL_MS);
  });
}

async function fetchDashboard() {
  try {
    const res = await fetch('/api/dashboard');
    const data = await res.json();
    render(data);
    return data.poll_interval_ms;
  } catch (err) {
    document.getElementById('footerStrip').innerHTML =
      `<div class="error-pill">Couldn't reach the dashboard — retrying...</div>`;
    console.error(err);
    return DEFAULT_POLL_INTERVAL_MS;
  }
}

function delayTagClass(minutes) {
  if (minutes <= 0) return 'delay-ontime';
  if (minutes < 10) return 'delay-minor';
  return 'delay-late';
}

function render(data) {
  const greetingEl = document.getElementById('greeting');
  if (data.active_window === 'morning') {
    greetingEl.textContent = 'Good morning';
  } else if (data.active_window === 'afternoon') {
    greetingEl.textContent = 'Welcome back';
  } else {
    greetingEl.textContent = '';
  }

  function getSeenAlertKeys() {
    try {
      return new Set(JSON.parse(localStorage.getItem('seenAlertKeys') || '[]'));
    } catch {
      return new Set();
    }
  }

  function markAlertSeen(key) {
    const seen = getSeenAlertKeys();
    seen.add(key);
    localStorage.setItem('seenAlertKeys', JSON.stringify([...seen]));
  }

  const a = data.alerts;
  const seenKeys = getSeenAlertKeys();
  const currentEntries = [];

  if (a.has_critical_alerts) {
    a.critical_alerts.forEach(alert => {
      currentEntries.push({
        key: `${alert.line}|${alert.last_updated}`,
        text: `${alert.line}: ${(alert.alert_text || '').replace(/<[^>]*>/g, '') || Object.entries(alert.flags).filter(([k,v]) => v).map(([k]) => k).join(', ')}`
      });
    });
  }
  if (a.has_recent_advisories) {
    a.recent_advisories.forEach(adv => {
      currentEntries.push({
        key: `${adv.line}|${adv.last_updated}`,
        text: `${adv.line}: ${adv.advisory_text.replace(/<[^>]*>/g, '')}`
      });
    });
  }

  document.getElementById('footerStrip').innerHTML = currentEntries
    .filter(e => !seenKeys.has(e.key))
    .map(e => `<div class="alert-item" data-alert-key="${escapeHtml(e.key)}">${escapeHtml(e.text)}</div>`)
    .join('');

  document.querySelectorAll('.alert-item').forEach(el => {
    el.addEventListener('click', () => {
      markAlertSeen(el.getAttribute('data-alert-key'));
      el.remove();
    });
  });

  const alertsHtml = currentEntries.filter(e => !seenKeys.has(e.key)).map(e => e.html).join('');
  document.getElementById('footerStrip').innerHTML = alertsHtml;
  localStorage.setItem('seenAlertKeys', JSON.stringify(currentEntries.map(e => e.key)));

  const commuteCard = document.getElementById('commuteCard');
  const c = data.commute;

    if (!data.active_window) {
      commuteCard.style.display = 'none';
    } else {
      commuteCard.style.display = '';
      commuteCard.classList.toggle('leave-now', !!c.leave_now);

      const totalDelayTag = c.total_delay_minutes > 0
        ? `<span class="delay-tag ${delayTagClass(c.total_delay_minutes)}">${c.total_delay_minutes} min behind schedule</span>`
        : `<span class="delay-tag delay-ontime">On time</span>`;

      const leaveByClass = (c.leave_now || c.minutes_until_leave_by < 0) ? 'leave-by-line urgent' : 'leave-by-line';
      let leaveByText;
      if (c.already_departed) {
        leaveByText = `Missed this train's ideal leave-by window`;
      } else if (c.leave_now) {
        leaveByText = `Leave now! (${c.leave_by_time})`;
      } else if (c.minutes_until_leave_by < 0) {
        leaveByText = `Leave-by was ${c.leave_by_time} (running behind)`;
      } else {
        leaveByText = `Leave by ${c.leave_by_time} (in ${c.minutes_until_leave_by} min)`;
      }

      let commuteHtml = `
        <div class="big-time">${c.origin_actual_departure_time}</div>
        <div class="sub-time">Scheduled ${c.origin_departure_time} · Train ${c.origin_train} (${c.origin_line})</div>
        <div class="${leaveByClass}">${leaveByText}</div>
        <div class="tag-row">${totalDelayTag}</div>
      `;

      if (c.trip_type === 'transfer') {
        commuteHtml += `
          <div class="transfer-info">
            <div>Transfer at ${c.connection_station}</div>
            <div>Connecting train ${c.connection_train} (${c.connection_line}) at ${c.connection_departure_time}${c.connection_delay_minutes > 0 ? ` (+${c.connection_delay_minutes} min)` : ''}</div>
            <div>Transfer buffer: ${Math.round(c.transfer_buffer_minutes)} min</div>
            <div>Arrive: ${c.actual_arrival_time}${c.actual_arrival_time !== c.arrival_time ? ` (scheduled ${c.arrival_time})` : ''}</div>
          </div>
        `;
      } else {
        commuteHtml += `
          <div class="transfer-info">
            <div>Direct train — no transfer needed</div>
            <div>Arrive: ${c.actual_arrival_time}${c.actual_arrival_time !== c.arrival_time ? ` (scheduled ${c.arrival_time})` : ''}</div>
          </div>
        `;
      }

      document.getElementById('commuteContent').innerHTML = commuteHtml;
    }

  const w = data.weather;
  let weatherHtml = `
    <div class="weather-temp">${Math.round(w.current_temp_f)}° now · ${Math.round(w.high_f)}° / ${Math.round(w.low_f)}°</div>
    <div class="weather-condition">${w.condition}</div>
  `;
  if (w.precip_chance >= 20) {
    weatherHtml += `<div class="commute-warning">${w.precip_chance}% chance of rain</div>`;
  }
  weatherHtml += `<div class="attire">${w.attire_suggestion}</div>`;
  if (w.commute_warnings && w.commute_warnings.length > 0) {
    weatherHtml += w.commute_warnings.map(warn =>
      `<div class="commute-warning">${warn}</div>`
    ).join('');
  }
  document.getElementById('weatherContent').innerHTML = weatherHtml;

  // --- Calendar card ---
  const cal = data.calendar;
  let calendarHtml;
  if (cal.error) {
    calendarHtml = `<div class="calendar-empty">${escapeHtml(cal.error)}</div>`;
  } else if (!cal.events || cal.events.length === 0) {
    calendarHtml = `<div class="calendar-empty">Nothing on the calendar today</div>`;
  } else {
    calendarHtml = '<div class="calendar-list">' + cal.events.map(ev => `
      <div class="calendar-event${ev.all_day ? ' all-day' : ''}">
        <div class="calendar-event-time">${ev.all_day ? 'All day' : ev.start_time}</div>
        <div class="calendar-event-title">${escapeHtml(ev.title)}</div>
      </div>
    `).join('') + '</div>';
  }
  document.getElementById('calendarContent').innerHTML = calendarHtml;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

scheduleNextFetch();
</script>

</body>
</html>
